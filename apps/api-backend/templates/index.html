<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClipPilot | Free Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: rgba(30, 41, 59, 0.7);
            --border-color: rgba(255, 255, 255, 0.1);
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --danger: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% -20%, #1e3a8a, transparent 50%),
                              radial-gradient(circle at -20% 50%, #4c1d95, transparent 50%);
            background-attachment: fixed;
            color: var(--text-main);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* Glassmorphism utility */
        .glass {
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border-color);
            border-radius: 16px;
        }

        /* Sidebar - Video List */
        .sidebar {
            width: 300px;
            padding: 20px;
            margin: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .sidebar h2 {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 10px;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .video-item {
            padding: 15px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.05);
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .video-item:hover, .video-item.active {
            background: rgba(59, 130, 246, 0.15);
            border-color: var(--accent-color);
            transform: translateY(-2px);
        }

        .video-item h3 {
            font-size: 1rem;
            font-weight: 600;
        }

        .video-item p {
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Main Content - Player & Editor */
        .main-content {
            flex: 1;
            display: flex;
            gap: 20px;
            padding: 20px 20px 20px 0;
            overflow: hidden;
        }

        /* Player Section */
        .player-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .player-container {
            width: 100%;
            max-width: 450px; /* Vertical video aspect ratio */
            aspect-ratio: 9/16;
            background: #000;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Editor Section */
        .editor-section {
            width: 450px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="text"], textarea, select {
            width: 100%;
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-size: 1rem;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            min-height: 100px;
        }

        .btn {
            background: var(--accent-color);
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success { background: var(--success); }
        .btn-success:hover { background: #059669; }

        /* AI Prompt Feature */
        .ai-rewrite-box {
            background: rgba(59, 130, 246, 0.1);
            border: 1px dashed var(--accent-color);
            padding: 12px;
            border-radius: 8px;
            margin-top: 5px;
            display: flex;
            gap: 10px;
        }

        .ai-rewrite-box input {
            flex: 1;
            padding: 8px;
            font-size: 0.9rem;
        }

        .ai-rewrite-box button {
            padding: 8px 12px;
            font-size: 0.9rem;
        }

        /* Loading Overlay */
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            border-top: 3px solid white;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .hidden { display: none !important; }
        
        #status-msg {
            font-size: 0.9rem;
            margin-top: 10px;
            text-align: center;
        }
        .error-text { color: var(--danger); }
        .success-text { color: var(--success); }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="sidebar glass" id="video-list">
        <h2>Your Videos</h2>
        <div id="video-list-content">
            <!-- Videos will be injected here via JS -->
            <p style="color: var(--text-muted); font-size: 0.9rem;">Loading videos...</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        
        <!-- Video Player -->
        <div class="player-section glass">
            <div class="player-container">
                <video id="video-player" controls>
                    <source src="" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <p id="player-title" style="margin-top: 20px; font-weight: 600; font-size: 1.2rem; color: var(--text-muted);">Select a video from the sidebar</p>
        </div>

        <!-- Metadata Editor -->
        <div class="editor-section glass" id="editor-panel" style="display: none;">
            <h2 style="font-size: 1.5rem; margin-bottom: 10px;">Metadata Editor</h2>
            
            <button class="btn" id="btn-auto-generate" onclick="generateMetadata()">
                <span id="gen-loader" class="loader hidden"></span>
                ✨ Auto-Generate with Gemini
            </button>

            <div class="form-group">
                <label for="meta-title">Title</label>
                <input type="text" id="meta-title" placeholder="Video Title...">
                <div class="ai-rewrite-box">
                    <input type="text" id="prompt-title" placeholder="E.g. Make it clickbaity">
                    <button class="btn" onclick="rewriteField('title')">Rewrite</button>
                </div>
            </div>

            <div class="form-group">
                <label for="meta-desc">Description</label>
                <textarea id="meta-desc" placeholder="Video Description..."></textarea>
                <div class="ai-rewrite-box">
                    <input type="text" id="prompt-desc" placeholder="E.g. Add emojis and a hook">
                    <button class="btn" onclick="rewriteField('description')">Rewrite</button>
                </div>
            </div>

            <div class="form-group">
                <label for="meta-tags">Hashtags</label>
                <input type="text" id="meta-tags" placeholder="#shorts #viral">
            </div>

            <div class="form-group">
                <label for="meta-vis">Visibility</label>
                <select id="meta-vis">
                    <option value="private">Private (Test)</option>
                    <option value="unlisted">Unlisted</option>
                    <option value="public">Public</option>
                </select>
            </div>

            <button class="btn btn-success" id="btn-publish" onclick="publishVideo()" style="margin-top: auto;">
                <span id="pub-loader" class="loader hidden"></span>
                🚀 Publish to YouTube
            </button>
            <div id="status-msg"></div>
        </div>

    </div>

    <script>
        let currentVideo = null;

        // Fetch videos on load
        fetch('/api/videos')
            .then(res => res.json())
            .then(data => {
                const container = document.getElementById('video-list-content');
                container.innerHTML = '';
                if(data.length === 0) {
                    container.innerHTML = '<p style="color: #94a3b8; font-size: 0.9rem;">No videos found.</p>';
                    return;
                }
                data.forEach(v => {
                    const el = document.createElement('div');
                    el.className = 'video-item';
                    el.innerHTML = `<h3>${v.name}</h3><p>${v.filename}</p>`;
                    el.onclick = () => selectVideo(v, el);
                    container.appendChild(el);
                });
            });

        function selectVideo(video, element) {
            // Update active state
            document.querySelectorAll('.video-item').forEach(el => el.classList.remove('active'));
            element.classList.add('active');

            currentVideo = video;
            
            // Update player
            const player = document.getElementById('video-player');
            player.src = `/video/${video.path}`;
            player.play();
            document.getElementById('player-title').innerText = video.name;

            // Show editor
            document.getElementById('editor-panel').style.display = 'flex';
            
            // Clear fields
            document.getElementById('meta-title').value = '';
            document.getElementById('meta-desc').value = '';
            document.getElementById('meta-tags').value = '';
            document.getElementById('status-msg').innerHTML = '';
        }

        async function generateMetadata() {
            if(!currentVideo) return;
            const btn = document.getElementById('btn-auto-generate');
            const loader = document.getElementById('gen-loader');
            
            btn.disabled = true;
            loader.classList.remove('hidden');

            try {
                const res = await fetch('/api/generate_metadata', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({topic: currentVideo.name})
                });
                const data = await res.json();
                
                if(data.error) throw new Error(data.error);

                document.getElementById('meta-title').value = data.title || '';
                document.getElementById('meta-desc').value = data.description || '';
                document.getElementById('meta-tags').value = data.hashtags || '';
            } catch(e) {
                alert("Error generating metadata: " + e.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }

        async function rewriteField(field) {
            const promptInputId = field === 'title' ? 'prompt-title' : 'prompt-desc';
            const valueInputId = field === 'title' ? 'meta-title' : 'meta-desc';
            
            const prompt = document.getElementById(promptInputId).value;
            const currentText = document.getElementById(valueInputId).value;
            
            if(!prompt) return alert("Please enter a prompt instruction.");
            if(!currentText) return alert("Field is empty. Generate metadata first.");

            try {
                const res = await fetch('/api/rewrite_metadata', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        field: field,
                        current_text: currentText,
                        prompt: prompt
                    })
                });
                const data = await res.json();
                if(data.error) throw new Error(data.error);
                
                document.getElementById(valueInputId).value = data.result;
                document.getElementById(promptInputId).value = ''; // clear prompt
            } catch(e) {
                alert("Error rewriting: " + e.message);
            }
        }

        async function publishVideo() {
            if(!currentVideo) return;
            
            const btn = document.getElementById('btn-publish');
            const loader = document.getElementById('pub-loader');
            const status = document.getElementById('status-msg');
            
            btn.disabled = true;
            loader.classList.remove('hidden');
            status.innerHTML = 'Uploading... (This may take a minute)';
            status.className = '';

            try {
                const res = await fetch('/api/publish', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        video_path: currentVideo.path,
                        title: document.getElementById('meta-title').value || currentVideo.name,
                        description: document.getElementById('meta-desc').value,
                        hashtags: document.getElementById('meta-tags').value,
                        visibility: document.getElementById('meta-vis').value
                    })
                });
                
                const data = await res.json();
                
                if(data.success) {
                    status.innerHTML = `✅ Successfully published! <br><a href="${data.url}" target="_blank" style="color: var(--accent-color);">View on YouTube</a>`;
                    status.className = 'success-text';
                } else {
                    throw new Error(data.error || "Upload failed");
                }
            } catch(e) {
                status.innerHTML = `❌ Error: ${e.message}`;
                status.className = 'error-text';
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
